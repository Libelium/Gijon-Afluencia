[project]
name = "queues-consumer"
authors = [{ name = "Libelium Comunicaciones Distribuidas, S.L." }]
license = "EUPL-1.2"
version = "0.27.2"
description = "Celery worker fleet for the PID Gijón platform"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "pydantic>=2.10,<2.11",
    "pydantic-settings>=2,<3",
    "sqlalchemy==2.0.2",
    "GeoAlchemy2==0.14.2",
    "psycopg2-binary==2.9.5",
    "python-dotenv==0.21.1",
    "boto3>=1.21.4",
    "requests==2.31.0",
    "fastapi>=0,<1",
    "uvicorn==0.20.0",
    "pika==1.3.0",
    "numpy==1.24.4",
    "pandas==2.0.3",
    "python-dateutil==2.9.0.post0",
    "celery==5.3.6",
    "sqlalchemy-celery-beat>=0.8.4",
    "minio==7.2.4",
    "jinja2==3.1.3",
    "aether-pylib>=0.7.0",
    "openpyxl>=3.1.5",
    "prometheus_client>=0.24.1",
]

[dependency-groups]
test = [
    "pytest==7.2.1",
    "pytest-mock==3.10.0",
    "mock==5.1.0",
    "freezegun>=1.5.1",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
aether-pylib = { path = "../pylibs/aether-pylib", editable = true }
