# SEC-042. Versions carrying known CVEs, replaced by floors that include the fix
# and capped at the next major so a future breaking release cannot arrive
# unannounced (COD-104):
#   jinja2  3.1.3  -> CVE-2024-34064 (3.1.4), CVE-2024-56201 and CVE-2024-56326
#                     (3.1.5), CVE-2025-27516 (3.1.6)
#   requests 2.31.0 -> CVE-2024-35195 (2.32.0), CVE-2024-47081 (2.32.4)
#   python-dotenv 0.21.1 -> unmaintained line, superseded by 1.x
[project]
name = "queues-consumer"
authors = [{ name = "Libelium Comunicaciones Distribuidas, S.L." }]
license = "EUPL-1.2"
version = "0.27.2"
description = "Celery worker fleet for the PID Gijón platform"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "pydantic>=2.10,<2.11",
    "pydantic-settings>=2,<3",
    "sqlalchemy==2.0.2",
    "GeoAlchemy2==0.14.2",
    "psycopg2-binary==2.9.5",
    "python-dotenv>=1.0.1,<2",
    "boto3>=1.21.4",
    "requests>=2.32.4,<3",
    "fastapi>=0,<1",
    "uvicorn==0.20.0",
    "pika==1.3.0",
    "numpy==1.24.4",
    "pandas==2.0.3",
    "python-dateutil==2.9.0.post0",
    "celery==5.3.6",
    "sqlalchemy-celery-beat>=0.8.4",
    "minio==7.2.4",
    "jinja2>=3.1.6,<4",
    "aether-pylib>=0.7.0",
    "openpyxl>=3.1.5",
    "prometheus_client>=0.24.1",
    # SEC-023. Hardened XML parser for the KML importer: the stdlib
    # xml.etree.ElementTree expands external entities (XXE) and nested
    # entity definitions (billion laughs) on user-uploaded files.
    "defusedxml>=0.7.1,<0.8",
]

[dependency-groups]
test = [
    "pytest==7.2.1",
    "pytest-mock==3.10.0",
    "freezegun>=1.5.1",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
# FUN-019, actual root cause. The test dependencies live in the `test` group, but
# uv's default group selection is `dev`, so a bare `uv sync` outside the container
# installed neither pytest nor mock - and the suite failed to collect with
# "ModuleNotFoundError: No module named 'mock'". That error was read as a missing
# declaration; the declaration was there all along (and so was the entry in
# uv.lock), it was simply not selected. The Dockerfile never hit it because it
# passes --all-groups.
#
# Naming the group as a default makes a plain `uv sync` reproduce the container's
# test environment. The image is unaffected: it selects groups explicitly.
default-groups = ["test"]

[tool.uv.sources]
aether-pylib = { path = "../pylibs/aether-pylib", editable = true }
