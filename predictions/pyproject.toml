[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictions"
version = "0.1.0"
description = "LIDAR + Smart Spot sensor fusion and crowd forecasting for the platform"
authors = [{ name = "Ayuntamiento de Gijón" }]
license = "EUPL-1.2"
requires-python = ">=3.10,<3.11"

# THE single source of dependencies. requirements.txt is gone: the Dockerfile
# installs the project itself with `pip install ".[test]"`.
dependencies = [
    "pandas>=2.0,<3",
    # Imported directly (crowd_xgboost_model, transit_plausibility), so declared
    # directly: it arrives transitively via pandas/xgboost, but relying on that means
    # a bump of either of them can take it away.
    "numpy>=1.24,<3",
    "requests>=2.28,<3",
    "boto3>=1.26,<2",
    "minio==7.2.4",
    "python-dotenv>=1.0,<2",
    "pydantic-settings>=2.0,<3",
    "xgboost>=3.0,<4",
    # Imported directly by anomaly_detection/ (Birch, pairwise_distances_argmin_min) and
    # needed on top of that by xgboost's scikit-learn API (XGBRegressor): XGBModel.__init__
    # raises ImportError without it (xgboost.compat.SKLEARN_INSTALLED).
    "scikit-learn>=1.3,<2",
    "holidays>=0.90,<1",
]

[project.optional-dependencies]
# An EXTRA and not a [dependency-groups] group: the image installs with plain pip, and
# `pip install --group` needs pip 25.1+.
# pytest-mock was here for parity with queues-consumer and NOTHING used it (zero
# uses of `mocker` in the suite, which goes through unittest.mock). Add it back if a
# test ever wants the fixture.
test = ["pytest==7.2.1"]

[tool.setuptools]
# Only the library. scripts/ and tests/ are not importable packages on purpose -
# scripts/ holds the container entry points and nothing imports them.
packages = [
    "crowd_predictions",
    "crowd_predictions.anomaly_detection",
    "crowd_predictions.config",
    "crowd_predictions.etl",
    "crowd_predictions.etl.crowd",
    "crowd_predictions.etl.ote",
    "crowd_predictions.etl.predict",
    "crowd_predictions.helpers",
]

[tool.pytest.ini_options]
# Only tests/ is collected. Without this, a bare `pytest` would also walk the
# production modules looking for test files.
testpaths = ["tests"]

# No `pythonpath` any more: crowd_predictions is an installed package (`pip install
# -e .`), so the tests import it the same way production does. It used to be a
# root conftest.py, and before that a sys.path.insert in all 21 test files.

# --strict-markers: an unregistered @pytest.mark.foo (a typo, typically) is an
#                   error instead of being silently ignored.
# --strict-config:  a typo in this file is an error instead of a warning.
# -ra:              short summary of everything that was not a plain pass, so
#                   skips and xfails do not go unnoticed in the CI log.
addopts = ["--strict-markers", "--strict-config", "-ra"]
