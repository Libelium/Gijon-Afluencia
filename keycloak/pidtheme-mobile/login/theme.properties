# Mobile login theme: same look & feel as pidtheme, but the card renders as a
# full-height bottom-sheet (see resources/css/mobile.css). Everything else
# (templates, scripts, messages, images, backendUrl/defaultLocale placeholders,
# kc* css classes) is inherited from the parent theme.
parent=pidtheme

# Re-declare styles to append mobile.css. all.min.css / style.css are not present
# in this theme's resources; Keycloak resolves them from the parent theme.
styles=css/all.min.css css/style.css css/mobile.css

# Re-declare scripts WITHOUT js/parallax.js: mobile has no pointer, and the
# parallax transform would only ever offset the logo layer. Everything else is
# inherited (resolved from the parent theme's resources).
scripts=js/passwordVisibility.js js/dynamicLogo.js js/localePersistence.js
