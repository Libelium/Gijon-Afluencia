services:
  postgres:
    image: postgres:16-alpine
    container_name: keycloak-postgres
    hostname: postgres
    environment:
      POSTGRES_DB: ${KC_DB_URL_DATABASE}
      POSTGRES_USER: ${KC_DB_USERNAME}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - keycloak_network
    ports:
      - "${BIND_ADDR:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USERNAME} -d ${KC_DB_URL_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    hostname: keycloak
    container_name: keycloak
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - keycloak_network
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8080:8080"
      - "${BIND_ADDR:-127.0.0.1}:8443:8443"
      - "9010:9000"
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local

networks:
  keycloak_network:
    driver: bridge
