# Configuracion de nginx para servir el paquete estatico de PID-GIJON.
#
# Sustituye por completo a /etc/nginx/nginx.conf. No lleva directiva `user`: el proceso
# corre como el usuario del contenedor (nginx, sin privilegios).
#
# El pid y los ficheros temporales van a /var/cache/nginx y NO a /tmp. Es deliberado:
# /tmp tiene el bit sticky, y el `nginx -t` que valida esta configuracion al construir la
# imagen corre como root y deja ahi un nginx.pid suyo. Con el sticky puesto, el usuario
# nginx no puede sobrescribir un fichero de root, y el contenedor no arrancaba. En
# /var/cache/nginx, que es del usuario nginx, no hay ese problema.

worker_processes auto;
pid /var/cache/nginx/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format app '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout app;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    server_tokens off;

    keepalive_timeout 65;
    client_max_body_size 1m;

    client_body_temp_path /var/cache/nginx/client-body;
    proxy_temp_path       /var/cache/nginx/proxy;
    fastcgi_temp_path     /var/cache/nginx/fastcgi;
    uwsgi_temp_path       /var/cache/nginx/uwsgi;
    scgi_temp_path        /var/cache/nginx/scgi;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    server {
        listen      8080;
        listen      [::]:8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # text/html no se lista: nginx lo incluye siempre y repetirlo produce un aviso.
        charset       utf-8;
        charset_types text/css text/javascript application/javascript application/json image/svg+xml;

        include /etc/nginx/security-headers.conf;

        # Sonda de vida del contenedor. Fuera del registro de accesos: la consulta el
        # HEALTHCHECK cada 30 s y no aporta nada al log.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Configuracion de ejecucion generada por deploy/entrypoint.sh en cada arranque.
        # NUNCA se cachea: si se cacheara, un contenedor arrancado con otras variables
        # seguiria sirviendo la configuracion anterior desde el navegador.
        location = /config.js {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
        }

        # Los ficheros con huella del contenido en el nombre son inmutables: se cachean
        # un ano. Sin `try_files ... =404` un asset que falta devolveria index.html con
        # tipo text/html, y el navegador fallaria con un error de MIME desconcertante.
        # Se usa add_header y no `expires 1y`: `expires` emite ademas su propio
        # Cache-Control y la respuesta saldria con la cabecera repetida.
        location /assets/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
            try_files $uri =404;
        }

        # index.html apunta a la version desplegada, asi que no se cachea: de lo contrario
        # los navegadores seguirian pidiendo los fragmentos de la version anterior tras un
        # despliegue y la aplicacion se romperia a medias. Es el par de la regla anterior.
        location = /index.html {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        # La regla imprescindible de una SPA con historial HTML5: las rutas de la
        # aplicacion (/entidades, /paneles/12) no existen como ficheros. Sin esta
        # reescritura la navegacion interna funciona, pero recargar la pagina o entrar por
        # un enlace directo devuelve 404.
        location / {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri $uri/ /index.html;
        }

        # Ni ficheros ocultos ni fuentes de mapa: no deberia haberlos en dist/, pero si
        # alguien copia de mas, no se sirven.
        location ~ /\. {
            deny all;
        }

        location ~ \.map$ {
            deny all;
        }
    }
}
