# Cabeceras de seguridad comunes.
#
# Se mantienen en un fichero aparte y se incluyen en CADA bloque location porque
# `add_header` no acumula: en cuanto un location declara su propia cabecera, DESCARTA
# todas las que heredaba del bloque padre. Sin este include, anadir un Cache-Control en
# /assets/ dejaria esa ruta sin cabeceras de seguridad, y en silencio.

# El navegador respeta el Content-Type declarado y no lo adivina.
add_header X-Content-Type-Options "nosniff" always;

# La aplicacion no se puede empotrar en un iframe ajeno.
add_header X-Frame-Options "DENY" always;

# Al salir a otro sitio se envia solo el origen, y nada si se baja a HTTP.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Ninguna de estas API del navegador la usa la aplicacion.
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

# HSTS y Content-Security-Policy NO se ponen aqui: dependen del dominio publico y de las
# URL de la API, del proveedor de identidad y del servidor de teselas, que cambian en cada
# despliegue. Los pone el terminador TLS que va delante. Ver docs/deployment.md.
