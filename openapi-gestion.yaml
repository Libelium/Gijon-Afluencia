components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT emitido por Keycloak (flujo de código con PKCE). Se obtiene y se renueva contra el proveedor de identidad.
  schemas:
    PredictionEvent:
      type: object
      properties:
        id:
          type: string
          description: Posición en el registro y huella de la fila, para borrarla.
        date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        event_type:
          type: string
        device_ids:
          type: array
          items:
            type: string
          description: Vacío, todas las zonas.
        notes:
          type: string
        start_hour:
          type: integer
          nullable: true
        end_hour:
          type: integer
          nullable: true
    OrganizationUser:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        enabled:
          type: boolean
        status:
          type: string
          enum:
          - active
          - suspended
          - blocked
        isOrganizationAdmin:
          type: boolean
        accessLevel:
          type: string
          enum:
          - read
          - edit
          nullable: true
        roles:
          type: array
          items:
            type: string
        mfa:
          type: boolean
          description: Verificación en dos pasos por correo activa
        lastActivity:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          nullable: true
