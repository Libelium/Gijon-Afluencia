  /V1/connectors/out/mqtt:
    post:
      tags:
      - Conectores de salida
      summary: Alta de un conector MQTT
      operationId: MqttConnector_store_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                use_readable_names:
                  type: boolean
                ipAddress:
                  type: string
                  description: Host o IP del servidor MQTT, sin esquema, ruta ni credenciales.
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                username:
                  type: string
                  nullable: true
                password:
                  type: string
                  nullable: true
                  description: Nunca se devuelve. Al editar, vacía conserva la actual.
                clientId:
                  type: string
                  nullable: true
                  description: Vacío, se genera uno distinto en cada conexión.
                ssl:
                  type: boolean
                sslCert:
                  type: string
                  nullable: true
                  description: Certificado PEM de la CA del servidor, si no es pública.
                clientCert:
                  type: string
                  nullable: true
                  description: Certificado PEM de cliente (TLS mutuo). Exige ssl y clientKey.
                clientKey:
                  type: string
                  nullable: true
                  description: Clave privada PEM del cliente. Nunca se devuelve. Al editar, vacía conserva la actual.
                topicTemplate:
                  type: array
                  description: 'Partes del topic. Variables: urn, tenant y scope (legacy, también measure); en los formatos periódicos, solo id (un mensaje por elemento).'
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - static
                        - variable
                      value:
                        type: string
                    required:
                    - type
                    - value
                payload_type:
                  type: string
                  enum:
                  - occupancy_readings
                  - flow_readings
                  - device_inventory
                  - normalized
                  - key_value
                  - legacy
                payload_config:
                  type: array
                  description: Solo con legacy. Campos de cada mensaje, [{key, value, active}].
                  items:
                    type: object
              required:
              - name
              - ipAddress
              - port
              - ssl
              - topicTemplate
              - payload_type
      responses:
        '201':
          description: Creado. Devuelve el conector, sin contraseña ni clave privada.
        '401':
          description: No autenticado
        '403':
          description: Sin permiso
        '422':
          description: Datos inválidos
