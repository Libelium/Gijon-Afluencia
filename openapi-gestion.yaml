# Generado desde las rutas reales del backend (php artisan route:list).
# Regenerar tras tocar backend/src/routes/api.php.
openapi: 3.0.3
info:
  title: PID Gijón — API de gestión
  version: 1.0.0
  description: 'API de lectura y gestión de la Plataforma de Integración de Datos del Ayuntamiento de
    Gijón.


    El dato **no entra por aquí**: la ingesta va por el núcleo FIWARE (sensor → IoT Agent → Orion-LD →
    RabbitMQ → consumidores). Esta API cubre entidades, dispositivos, series temporales, cuadros de mando,
    alarmas y preferencias.


    Autenticación por *bearer token* JWT emitido por Keycloak. La API no participa en la sesión: el
    token se obtiene y se renueva contra el proveedor de identidad (código de autorización + PKCE para
    clientes de navegador). Las rutas bajo `/internal` no llevan token: solo son accesibles desde la
    red interna y las consume el gateway APISIX para validar permiso de escritura por tenant.'
  license:
    name: EUPL-1.2
    url: https://joinup.ec.europa.eu/collection/eupl/eupl-text-eupl-12
servers:
- url: /api
  description: Ruta base del servicio
security:
- bearerAuth: []
tags:
- name: Alarmas
- name: Auditoría
- name: Autenticación y usuario
- name: Ayuda
- name: Cuadros de mando
- name: Dispositivos
- name: Entidades
- name: 'FIWARE: tenants y scopes'
- name: Grupos de entidades
- name: Interno (gateway)
- name: Notificaciones
- name: Pantalla de inicio
- name: Preferencias
- name: Series temporales
- name: Último dato
