apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.clusterIP.name }}
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: mongodb
      port: {{ .Values.service.clusterIP.port }}
      targetPort: mongodb
      protocol: TCP
  selector:
    {{- include "mongodb.selectorLabels" . | nindent 4 }}
