# =====================================================================
# MongoDB chart — default values
# Deploys MongoDB as a StatefulSet (no external operator required).
# =====================================================================

image:
  repository: mongo
  tag: "5.0.31"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  clusterIP:
    name: mongo-svc
    port: 27017
  headless:
    name: mongo-headless

persistence:
  enabled: true
  storageClass: ""
  size: 10Gi
  accessMode: ReadWriteOnce

resources: {}
# limits:
#   cpu: 1000m
#   memory: 2Gi
# requests:
#   cpu: 500m
#   memory: 1Gi

livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

credentials:
  # IMPORTANT: do NOT commit these values. Provide them at deploy time via
  # --set, an external secret manager, or scripts/generate-env.sh.
  # The FIWARE components expect this username; keep it unless you know better.
  username: "fiware-mongo-user"
  password: ""
  secretName: "mongo-creds"
  # Authentication database.
  authDatabase: "admin"
