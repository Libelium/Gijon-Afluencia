{{- range $name, $component := .Values.components }}
{{- if and $component.enabled $component.hpa $component.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "pid-gijon-core.kebabcase" $name }}-hpa
  labels:
    {{- include "pid-gijon-core.labels" $ | nindent 4 }}
    service: pid-gijon-{{ include "pid-gijon-core.kebabcase" $name }}
    {{- if $.Values.global.environment }}
    environment: {{ $.Values.global.environment }}
    {{- end }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "pid-gijon-core.kebabcase" $name }}
  minReplicas: {{ $component.hpa.minReplicas }}
  maxReplicas: {{ $component.hpa.maxReplicas }}
  {{- if or $component.hpa.targetCPUUtilizationPercentage $component.hpa.targetMemoryUtilizationPercentage $component.hpa.metrics }}
  metrics:
  {{- if $component.hpa.metrics }}
  {{- toYaml $component.hpa.metrics | nindent 2 }}
  {{- else }}
  {{- if $component.hpa.targetCPUUtilizationPercentage }}
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ $component.hpa.targetCPUUtilizationPercentage }}
  {{- end }}
  {{- if $component.hpa.targetMemoryUtilizationPercentage }}
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: {{ $component.hpa.targetMemoryUtilizationPercentage }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if $component.hpa.behavior }}
  behavior:
    {{- toYaml $component.hpa.behavior | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
