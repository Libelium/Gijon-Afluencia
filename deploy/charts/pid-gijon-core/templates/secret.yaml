{{/*
Only rendered when secretsStrategy.type == "values". For the "external" strategy
the deployer provides Secrets out-of-band (e.g. External Secrets Operator,
Sealed Secrets, SOPS) and the Deployment references them by name. See
docs/05-secrets.md.
*/}}
{{- if eq .Values.secretsStrategy.type "values" }}
{{- range $name, $component := .Values.components }}
{{- if and $component.enabled $component.secrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pid-gijon-core.kebabcase" $name }}-secret
  labels:
    {{- include "pid-gijon-core.labels" $ | nindent 4 }}
    service: pid-gijon-{{ include "pid-gijon-core.kebabcase" $name }}
    {{- if $.Values.global.environment }}
    environment: {{ $.Values.global.environment }}
    {{- end }}
type: Opaque
data:
  {{- range $key, $value := $component.secrets }}
  {{ $key }}: {{ $value | toString | b64enc }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
