{{- if and .Values.KedaAutoscale (hasKey .Values.KedaAutoscale "rabbitmq") }}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq-trigger-auth
  labels:
    {{- include "pid-gijon-core.labels" . | nindent 4 }}
spec:
  secretTargetRef:
  - parameter: host
    name: rabbitmq-credentials
    key: host
  - parameter: username
    name: rabbitmq-credentials
    key: username
  - parameter: password
    name: rabbitmq-credentials
    key: password
{{- end }}
