{{/*
Credentials Secret consumed by the KEDA RabbitMQ TriggerAuthentication.
Only rendered when KEDA autoscaling is configured. Requires the KEDA operator.
*/}}
{{- if and .Values.KedaAutoscale (hasKey .Values.KedaAutoscale "rabbitmq") }}
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  labels:
    {{- include "pid-gijon-core.labels" . | nindent 4 }}
type: Opaque
stringData:
  # TODO: provide RabbitMQ credentials via KedaAutoscale.rabbitmq.* (do not commit real values).
  username: {{ .Values.KedaAutoscale.rabbitmq.username | default "" | quote }}
  password: {{ .Values.KedaAutoscale.rabbitmq.password | default "" | quote }}
  host: {{ .Values.KedaAutoscale.rabbitmq.host | default "" | quote }}
{{- end }}
