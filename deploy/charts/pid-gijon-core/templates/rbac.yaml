{{/*
Role + RoleBinding granting the leader-elector sidecar access to coordination
Leases, for components with leaderElection enabled.
*/}}
{{- range $name, $component := .Values.components }}
{{- if and $component.enabled $component.leaderElection }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "pid-gijon-core.kebabcase" $name }}-leader-election
  labels:
    {{- include "pid-gijon-core.labels" $ | nindent 4 }}
    service: pid-gijon-{{ include "pid-gijon-core.kebabcase" $name }}
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "pid-gijon-core.kebabcase" $name }}-leader-election
  labels:
    {{- include "pid-gijon-core.labels" $ | nindent 4 }}
    service: pid-gijon-{{ include "pid-gijon-core.kebabcase" $name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "pid-gijon-core.kebabcase" $name }}-leader-election
subjects:
- kind: ServiceAccount
  name: {{ include "pid-gijon-core.kebabcase" $name }}
{{- end }}
{{- end }}
