  # ---------------------------------------------------------------------------
  # keycloak — Identity & Access Management. Uses the platform's Keycloak image.
  # ---------------------------------------------------------------------------
  keycloak:
    enabled: true
    image:
      repository: keycloak
      tag: ""                   # TODO: pin the platform image tag
      pullPolicy: IfNotPresent
    replicas: 1
    # Recreate y NO RollingUpdate: con `maxSurge: 1` el pod nuevo convive con el viejo, los dos
    # intentan formar el cluster de Infinispan y el nuevo muere con
    #   ERROR: Failed to start embedded or remote cache manager
    # una y otra vez. Keycloak agrupa por JGroups y su pila por defecto usa multicast UDP, que en
    # Kubernetes no descubre nada; por eso la PRIMERA instalacion funciona —un solo pod forma un
    # cluster de uno sin descubrir a nadie— y falla justo al actualizar.
    #
    # Recreate para el pod viejo antes de crear el nuevo, asi que nunca hay dos. Con `replicas: 1`
    # el coste es una interrupcion breve del inicio de sesion durante la actualizacion, y no se
    # pierde nada: la alternativa (varias replicas de verdad) exige ademas KC_CACHE_STACK=kubernetes
    # y un Service headless para DNS_PING, y con una sola replica no aporta nada.
    #
    # Si alguna vez se sube `replicas` por encima de 1, hay que configurar antes esa pila.
    strategy:
      type: Recreate
    hpa:
      # No activar sin configurar antes KC_CACHE_STACK=kubernetes: escalar Keycloak con la pila
      # por defecto reproduce el fallo del cache manager descrito arriba.
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
    pdb:
      enabled: false
      minAvailable: 1
    # Clustered cache via JGroups DNS discovery (works with 1+ replicas; required
    # for HA when replicas > 1).
    args:
      - "--cache=ispn"
      - "--cache-stack=kubernetes"
    ports:
      - containerPort: 8080
        protocol: TCP
        name: keycloak
      - containerPort: 9000
        protocol: TCP
        name: keycloak-admin
      - containerPort: 7800
        protocol: TCP
        name: jgroups-tcp
      - containerPort: 57800
        protocol: TCP
        name: jgroups-tcp-fd
    service:
      - port: 8080
        name: keycloak
      - port: 9000
        name: keycloak-admin
    # Headless service for JGroups discovery (DNS_PING).
    headless:
      enabled: true
      publishNotReadyAddresses: true
      ports:
        - port: 7800
          name: jgroups-tcp
          protocol: TCP
        - port: 57800
          name: jgroups-tcp-fd
          protocol: TCP
    # Keycloak arranca despacio: JVM, importacion del realm y descubrimiento de Infinispan.
    # Con solo liveness, el presupuesto es initialDelay + periodSeconds*failureThreshold, y al
    # agotarse el kubelet REINICIA el contenedor — que vuelve a empezar de cero y vuelve a
    # agotarlo: un bucle de reinicios del que no sale solo. Se ve como `connection refused` en
    # /health/live mientras el arranque va bien por dentro.
    #
    # El startupProbe existe exactamente para esto: mientras no pase, liveness y readiness estan
    # suspendidas, y en cuanto pasa una vez deja de evaluarse. 10 minutos de margen para arrancar
    # y, a partir de ahi, la vigilancia estrecha de siempre.
    startupProbe:
      httpGet:
        path: /health/started
        port: keycloak-admin
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 60
    livenessProbe:
      httpGet:
        path: /health/live
        port: keycloak-admin
      periodSeconds: 30
      timeoutSeconds: 15
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /health/ready
        port: keycloak-admin
      periodSeconds: 30
      timeoutSeconds: 15
      successThreshold: 1
    resources: {}
    gatewayAPI:
      enabled: false
      # routes:
      #   - httpsOnly: true
      #     route:
      #       gateway: public-gateway
      #       hostnames: ["kc.example.com"]
      #       backendPort: 8080
    config:
      KC_DB: postgres
      KC_DB_URL_HOST: <CHANGE_ME>         # PostgreSQL host (keycloak database)
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: keycloak
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_FEATURES: token-exchange
      KC_LOG_LEVEL: "warn,org.keycloak.events:info"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      PROXY_ADDRESS_FORWARDING: "true"
      KC_PROXY_ADDRESS_FORWARDING: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HOSTNAME: <CHANGE_ME>            # public Keycloak URL (https://kc.example.com)
      KC_HOSTNAME_ADMIN: <CHANGE_ME>      # public Keycloak admin URL (usually same as KC_HOSTNAME)
      KC_BOOTSTRAP_ADMIN_USERNAME: admin  # bootstrap admin username (password is a secret)
      BACKEND_URL: http://web-back        # internal backend service
      # OAuth callback URLs of the service clients. The realm no longer ships the
      # catch-all "/*"; the entrypoint defaults them to KC_HOSTNAME, which is the same
      # value web-back sends as KEYCLOAK_REDIRECT_URI when it exchanges the code.
      # Uncomment only if a deployment needs more than that (comma-separated).
      # KC_APP_REDIRECT_URIS: "https://kc.example.com,https://app.example.com/login"
      # KC_APP_WEB_ORIGINS: "https://app.example.com"
      #
      # Realm mail server. It carries the second-factor code and the password-reset
      # links, so the entrypoint requires it to be authenticated and encrypted: set
      # KC_SMTP_HOST here and KC_SMTP_USER / KC_SMTP_PASSWORD as secrets, and leave
      # STARTTLS (587) or SSL (465) on — with both off the pod refuses to start.
      # Leave KC_SMTP_HOST unset and there is NO mail: no password reset, no e-mail MFA.
      # KC_SMTP_HOST: <CHANGE_ME>
      # KC_SMTP_PORT: "587"
      # KC_SMTP_STARTTLS: "true"
      # KC_SMTP_SSL: "false"
      # KC_SMTP_FROM: no-reply@example.com
      # KC_SMTP_FROM_DISPLAY_NAME: PID Gijon
      # JGroups discovery + heap. Keeps the headless service name in sync.
      JAVA_OPTS_APPEND: "-Djava.net.preferIPv4Stack=true -Djgroups.dns.query=keycloak-headless -Xmx1g"
    secrets: {}
    #   KC_DB_USERNAME: ""              # TODO: set
    #   KC_DB_PASSWORD: ""              # TODO: set
    #   KEYCLOAK_ADMIN: ""             # TODO: set bootstrap admin username
    #   KEYCLOAK_ADMIN_PASSWORD: ""    # TODO: set a STRONG password (never reuse defaults)
    #   KC_LARAVEL_BACKEND_SECRET: ""  # TODO: set (openssl rand -base64 24)
    #   KC_REALM_MANAGEMENT_SECRET: "" # TODO: set (openssl rand -base64 24)
    #   KC_SMTP_USER / KC_SMTP_PASSWORD  # REQUIRED when KC_SMTP_HOST is set above
    # KC_LARAVEL_BACKEND_SECRET and KC_REALM_MANAGEMENT_SECRET are REQUIRED: the realm
    # export ships placeholders for the laravel-backend and realm-management client
    # secrets, and the image's entrypoint refuses to start unless both are present.

