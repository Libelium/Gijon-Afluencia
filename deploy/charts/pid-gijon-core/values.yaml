# =============================================================================
# pid-gijon-core — default values
# =============================================================================
# These are sane, infrastructure-agnostic defaults. They render a valid release
# but DO NOT contain any credentials and DO NOT point at real infrastructure.
#
# Convention used throughout:
#   - Values that point at OTHER pid-gijon-core services use stable in-cluster
#     names (e.g. http://orion-ld:1026) and are left as-is.
#   - Values that point at EXTERNAL services (databases, broker, storage, mail,
#     public URLs) are <CHANGE_ME> placeholders.
#   - Optional integrations are commented out with a `# TODO:` marker.
#   - Every `secrets:` map is empty — fill it in your own values file or use the
#     external secret strategy. NEVER commit real secret values.
#
# The fastest path is to run scripts/generate-env.sh, which renders a complete
# overlay for you (environments/<name>/pid-gijon-core.values.yaml). See README.md.
# =============================================================================

nameOverride: ""
fullnameOverride: ""

# -----------------------------------------------------------------------------
# Global settings shared by every component.
# -----------------------------------------------------------------------------
global:
  # GDTIS-PT01-SEC-026 — endurecimiento de contenedores.
  # Vacio por defecto A PROPOSITO: este chart despliega tambien imagenes de
  # terceros (Orion-LD, IoT Agent, Keycloak) que no corren como no-root, y un
  # `runAsNonRoot` global las dejaria en CreateContainerConfigError.
  # Se activa por componente con `containerSecurityContext`. Los cuatro
  # componentes propios de Python ya declaran USER 10001 en su Dockerfile, y para
  # ellos el valor recomendado es:
  #   containerSecurityContext:
  #     runAsNonRoot: true
  #     runAsUser: 10001
  #     runAsGroup: 10001
  #     allowPrivilegeEscalation: false
  #     readOnlyRootFilesystem: false   # queues-consumer escribe en app/tmp
  #     capabilities: { drop: ["ALL"] }
  #   podSecurityContext:
  #     seccompProfile: { type: RuntimeDefault }
  podSecurityContext: {}
  containerSecurityContext: {}

  # Optional container registry prepended to each component's image.repository.
  # Leave empty to use the repository as-is. Public images (FIWARE)
  # pin their own registry per component (image.registry) and are unaffected.
  # Example: registry.example.com/pid-gijon
  imageRegistry: ""

  # Image pull secrets (names of pre-created docker-registry Secrets) added to
  # every pod. Configure registry auth out-of-band; do not put credentials here.
  imagePullSecrets: []
  # - name: registry-credentials

  # Free-form environment identifier added as an `environment` label to every
  # resource (e.g. dev, staging, prod, or a customer name).
  environment: pid-gijon

  labels:
    app: pid-gijon-core

# -----------------------------------------------------------------------------
# Gateway API exposure.
#
# This chart only emits standard Gateway API objects (HTTPRoute / TCPRoute). The
# Gateways themselves are owned by your cluster's gateway controller (Traefik,
# Istio, NGINX Gateway, Envoy Gateway, Cilium, ...) and must already exist.
# Per-component routes attach to those Gateways by name. See docs/04-gateway-api.md.
# -----------------------------------------------------------------------------
gateway:
  enabled: true
  # Namespace where the parent Gateways live (overridable per route).
  namespace: gateway
  # Listener section name used when a route sets httpsOnly: true.
  httpsSectionName: https

# -----------------------------------------------------------------------------
# Secret management strategy.
#   values   - this chart renders Secrets from each component's `secrets:` map.
#   external - you provide Secrets out-of-band (External Secrets Operator,
#              Sealed Secrets, SOPS, ...); the chart references them by the names
#              configured below. Components' `secrets:` maps are ignored.
# See docs/05-secrets.md.
# -----------------------------------------------------------------------------
secretsStrategy:
  type: values
  externalSecrets:
    aetherLink: external-aether-link
    fiwareManager: external-fiware-manager
    iotAgentJson: external-iot-agent-json
    keycloak: external-keycloak
    orionLd: external-orion-ld
    cbConsumer: external-cb-consumer
    genericConsumer: external-generic-consumer
    carrot: external-carrot
    webBack: external-web-back

# =============================================================================
# COMPONENTS
#
# Each key becomes a Deployment + Service named after its kebab-cased key
# (aetherLink -> aether-link). Components address each other over those stable
# in-cluster names, so URLs in `config` such as http://orion-ld:1026 resolve
# automatically. Set `enabled: false` to skip a component.
# =============================================================================
components:

  # ---------------------------------------------------------------------------
  # aether-link — NGSI-LD subscription manager / data-link service.
  # ---------------------------------------------------------------------------
  aetherLink:
    enabled: true
    image:
      repository: aether-link
      tag: ""                   # TODO: pin the platform image tag before deploying
      pullPolicy: IfNotPresent
    replicas: 1
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    hpa:
      enabled: false
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 75
      targetMemoryUtilizationPercentage: 80
    pdb:
      enabled: false
      minAvailable: 1
    ports:
      - containerPort: 8000
        protocol: TCP
        name: aether
    service:
      - port: 8000
        name: aether
    livenessProbe:
      httpGet:
        path: /hchk
        port: aether
      initialDelaySeconds: 15
      periodSeconds: 30
      timeoutSeconds: 15
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /hchk
        port: aether
      initialDelaySeconds: 5
      periodSeconds: 30
      timeoutSeconds: 15
      successThreshold: 1
    resources: {}
    gatewayAPI:
      enabled: false
      # routes:
      #   - route:
      #       gateway: internal-gateway
      #       hostnames: ["aether-link.example.com"]
      #       backendPort: 8000
    config:
      CONTEXT_BROKER_TYPE: orionld
      CONTEXT_URL: https://uri.etsi.org/ngsi-ld/v1/ngsi-ld-core-context.jsonld   # NGSI-LD @context URL served to clients
      DATA_SOURCE_TYPE: timescale
      DEFAULT_TENANT: pidgijon
      IOTA_JSON_URL: http://iot-agent-json:4041
      IOTA_TYPE: iotajsonLd
      PLATFORM_SUBSCRIPTION_CONSUMER: http://carrot:8001/orion-ld/subscription
      PLATFORM_SUBSCRIPTION_URN: urn:ngsi-ld:subscription:pid-gijon:main
      PLATFORM_TS_DB_HOST: <CHANGE_ME>        # TimescaleDB host
      PLATFORM_TS_DB_NAME: <CHANGE_ME>        # TimescaleDB database name
      PLATFORM_TS_DB_PORT: "5432"
      ORION_LD_SERVICE: http://orion-ld:1026
      QUEUES_CONSUMER_API: http://carrot:8001
      GUNICORN_BIND: 0.0.0.0:8000
      GUNICORN_TIMEOUT: "0"
      GUNICORN_WORKER_CLASS: uvicorn.workers.UvicornWorker
      GUNICORN_LOGLEVEL: info
      GUNICORN_RELOAD: "false"
      GUNICORN_WORKERS: "3"
      GUNICORN_FORWARDED_ALLOW_IPS: "*"
    secrets: {}
    #   PLATFORM_TS_DB_USER: ""   # TODO: set (TimescaleDB user)
    #   PLATFORM_TS_DB_PASS: ""   # TODO: set (TimescaleDB password)

  # ---------------------------------------------------------------------------
  # fiware-manager — FIWARE entity management + data ingestion.
  # ---------------------------------------------------------------------------
  fiwareManager:
    enabled: true
    image:
      repository: fiware-manager
      tag: ""                   # TODO: pin the platform image tag
      pullPolicy: IfNotPresent
    replicas: 1
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    hpa:
      enabled: false
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 75
      targetMemoryUtilizationPercentage: 80
    pdb:
      enabled: false
      minAvailable: 1
    ports:
      - containerPort: 8000
        protocol: TCP
        name: fiware
    service:
      - port: 8000
        name: fiware
    livenessProbe:
      httpGet:
        path: /hchk
        port: fiware
      initialDelaySeconds: 45
      periodSeconds: 30
      timeoutSeconds: 15
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /hchk
        port: fiware
      initialDelaySeconds: 10
      periodSeconds: 30
      timeoutSeconds: 15
      successThreshold: 1
    resources: {}
    gatewayAPI:
      enabled: false
      # routes:
      #   - route:
      #       gateway: public-gateway
      #       hostnames: ["fiware-manager.example.com"]
      #       backendPort: 8000
    config:
      IOTA_SOUTH_SERVICE: http://iot-agent-json:7896
      MONGO_DB_DATABASE: iotajson
      MONGO_DB_HOST: <CHANGE_ME>          # MongoDB host
      MONGO_DB_PORT: "27017"
      GUNICORN_WORKER_CLASS: uvicorn.workers.UvicornWorker
      GUNICORN_BIND: 0.0.0.0:8000
      GUNICORN_KEEPALIVE: "30"
      GUNICORN_WORKERS: "2"
    secrets: {}
    #   MONGO_DB_USERNAME: ""    # TODO: set
    #   MONGO_DB_PASSWORD: ""    # TODO: set

  # ---------------------------------------------------------------------------
  # frontend — interfaz web (Vue + nginx). Estática: se configura en arranque.
  # ---------------------------------------------------------------------------
  frontend:
    enabled: true
    image:
      repository: frontend
      tag: ""                   # TODO: pin the platform image tag
      pullPolicy: IfNotPresent
    replicas: 1
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    hpa:
      enabled: false
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 75
      targetMemoryUtilizationPercentage: 80
    pdb:
      enabled: false
      minAvailable: 1
    ports:
      - containerPort: 8080
        protocol: TCP
        name: http
    service:
      - port: 8080
        name: http
    livenessProbe:
      httpGet:
        path: /healthz
        port: http
      initialDelaySeconds: 10
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /healthz
        port: http
      initialDelaySeconds: 5
      periodSeconds: 30
      timeoutSeconds: 5
      successThreshold: 1
    resources: {}
    gatewayAPI:
      enabled: false
      # routes:
      #   - route:
      #       gateway: public-gateway
      #       hostnames: ["app.example.com"]
      #       backendPort: 8080
    # El entrypoint escribe config.js con estas variables, así que la MISMA imagen
    # sirve para cualquier entorno. config.js lo descarga el navegador: aquí no va
    # ninguna credencial ni secreto de cliente OIDC.
    config:
      API_BASE_URL: <CHANGE_ME>           # URL pública de la API de gestión
      OIDC_URL: <CHANGE_ME>               # URL pública de Keycloak
      OIDC_REALM: pid-gijon
      OIDC_CLIENT_ID: pid-gijon-client
      MAP_TILES_URL: https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png
      # Obligatoria por los términos de uso de OpenStreetMap: si cambias el
      # proveedor de teselas, cambia también este texto (ver NOTICE.md).
      MAP_TILES_ATTRIBUTION: "&copy; colaboradores de OpenStreetMap"
      MAP_DEFAULT_CENTER: 43.5322,-5.6611
      MAP_DEFAULT_ZOOM: "13"
    secrets: {}

  # ---------------------------------------------------------------------------
  # iot-agent-json — FIWARE IoT Agent for JSON (MQTT/HTTP -> NGSI-LD). Public image.
  # ---------------------------------------------------------------------------
  iotAgentJson:
    enabled: true
    image:
      registry: quay.io
      repository: fiware/iotagent-json
      tag: "3.3.0"
      pullPolicy: IfNotPresent
    replicas: 1
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    hpa:
      enabled: false
      minReplicas: 1
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
    pdb:
      enabled: false
      minAvailable: 1
    ports:
      - containerPort: 7896
        protocol: TCP
        name: iota-south
      - containerPort: 4041
        protocol: TCP
        name: iota-north
    service:
      - port: 7896
        name: iota-south
      - port: 4041
        name: iota-north
    livenessProbe:
      httpGet:
        path: /iot/about
        port: iota-north
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 15
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /iot/about
        port: iota-north
      initialDelaySeconds: 10
      periodSeconds: 30
      timeoutSeconds: 15
      successThreshold: 1
    resources: {}
    gatewayAPI:
      enabled: false
      # routes:                            # south (7896) and/or north (4041)
      #   - route:
      #       gateway: internal-gateway
      #       hostnames: ["iota-json.example.com"]
      #       backendPort: 7896
    config:
      IOTA_NORTH_PORT: "4041"
      IOTA_HTTP_PORT: "7896"
      IOTA_LOG_LEVEL: INFO
      IOTA_TIMESTAMP: "true"
      IOTA_AUTOCAST: "true"
      IOTA_CB_HOST: orion-ld
      IOTA_CB_PORT: "1026"
      IOTA_CB_NGSI_VERSION: ld
      IOTA_PROVIDER_URL: http://iot-agent-json:4041
      IOTA_JSON_LD_CONTEXT: https://uri.etsi.org/ngsi-ld/v1/ngsi-ld-core-context.jsonld   # NGSI-LD @context URL
      IOTA_REGISTRY_TYPE: mongodb
      IOTA_MONGO_HOST: <CHANGE_ME>        # MongoDB host
      IOTA_MONGO_PORT: "27017"
      IOTA_MONGO_DB: iotajson
      IOTA_FALLBACK_TENANT: pidgijon
      IOTA_MONGO_AUTH_SOURCE: admin
      IOTA_AMQP_DISABLED: "true"
      # -- MQTT transport (optional; only if devices publish over MQTT).
      # Off by default: this chart deploys no MQTT broker (see docs/03-infrastructure.md).
      # Uncomment the four and set the host to enable it.
      # IOTA_MQTT_PROTOCOL: mqtt
      # IOTA_MQTT_HOST: <CHANGE_ME>       # MQTT broker host
      # IOTA_MQTT_PORT: "1883"
      # IOTA_MQTT_QOS: "1"
      # IOTA_MQTT_KEEPALIVE: "120"
    secrets: {}
    #   IOTA_MONGO_USER: ""      # TODO: set
    #   IOTA_MONGO_PASSWORD: ""  # TODO: set
    #   IOTA_MQTT_USERNAME: ""   # TODO: set (only if MQTT is used)
    #   IOTA_MQTT_PASSWORD: ""   # TODO: set (only if MQTT is used)

  # ---------------------------------------------------------------------------
  # orion-ld — FIWARE Orion-LD context broker (NGSI-LD). Public image.
  # ---------------------------------------------------------------------------
  orionLd:
    enabled: true
    image:
      registry: quay.io
      repository: fiware/orion-ld
      tag: "1.4.0"
      pullPolicy: IfNotPresent
    replicas: 1
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 1
    hpa:
      enabled: false
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 75
      targetMemoryUtilizationPercentage: 80
    pdb:
      enabled: false
      minAvailable: 1
    ports:
      - containerPort: 1026
        protocol: TCP
        name: orion-ld
      - containerPort: 8000
        protocol: TCP
        name: orion-ld-http
    service:
      - port: 8000
        name: orion-ld-http
      - port: 1026
        name: orion-ld
    livenessProbe:
      httpGet:
        path: /
        port: orion-ld-http
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 15
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /
        port: orion-ld-http
      initialDelaySeconds: 10
      periodSeconds: 30
      timeoutSeconds: 15
      successThreshold: 1
    resources: {}
    gatewayAPI:
      enabled: false
      # routes:
      #   - httpsOnly: true
      #     route:
      #       gateway: internal-gateway
      #       hostnames: ["orion-ld.example.com"]
      #       backendPort: 1026
    config:
      ORIONLD_TROE: "FALSE"
      ORIONLD_MULTI_SERVICE: "TRUE"
      ORIONLD_FORWARDING: "TRUE"
      ORIONLD_MONGO_HOST: <CHANGE_ME>      # MongoDB host
      ORIONLD_MONGO_PORT: "27017"
      ORIONLD_MONGO_DB: orion             # data database name (Orion-LD -db)
      ORIONLD_MONGO_POOL_SIZE: "300"
      # Must be EMPTY on Orion-LD 1.4.0. Orion builds its Mongo URI as
      # mongodb://<user>:<pass>@<ORIONLD_MONGO_HOST>?<ORIONLD_MONGO_AUTH_SOURCE>
      # with no "/" before the "?", which the mongoc driver rejects outright:
      #   Unable to connect to mongo(...): Invalid host string in URI
      # Adding the slash to the host fixes mongoc but breaks the legacy C++
      # driver, which then parses the port as "27017/" and aborts. There is no
      # value of this variable that yields a valid URI for both drivers.
      # Left empty, the URI carries no database, and the driver defaults
      # authSource to admin — which is where the generator creates the user.
      ORIONLD_MONGO_AUTH_SOURCE: ""
    # Orion-LD connects to MongoDB through the fragmented ORIONLD_MONGO_HOST/_PORT/
    # _USER/_PASSWORD fields (above + below), the same configuration the production
    # on-prem installs use. Do NOT use the single-URI -dbURI / ORIONLD_MONGO_URI
    # form — it has proven unreliable. scripts/generate-env.sh fills the credentials
    # in automatically.
    secrets: {}
    #   ORIONLD_MONGO_USER: ""       # TODO: set
    #   ORIONLD_MONGO_PASSWORD: ""   # TODO: set
    args:
      - "-logLevel"
      - INFO
      - "-troePoolSize"
      - "10"
      - "-forwarding"
      - "-insecureNotif"
    # --- Active/standby HA (optional) ---------------------------------------
    # Run multiple replicas with only one active, using a leader-elector sidecar.
    # When leaderElection is true the chart creates a ServiceAccount + Role/
    # RoleBinding and the sidecar coordinates via a Lease. Then add the sidecar
    # and the POD_NAME env below.
    # leaderElection: true
    # env:
    #   - name: POD_NAME
    #     valueFrom:
    #       fieldRef:
    #         fieldPath: metadata.name
    # initContainers:
    #   - name: leader-elector
    #     image: gleez/leader-elector
    #     tag: "0.9"
    #     restartPolicy: Always          # native sidecar (K8s >= 1.28)
    #     args:
    #       - "--election=orion-ld-leader"
    #       - "--http=0.0.0.0:4040"
    #       - "--ttl=10s"
    #     ports:
    #       - containerPort: 4040
    #         name: leader-http

  # ---------------------------------------------------------------------------
  # cb-consumer — processes context-broker notifications from RabbitMQ, persists
  # data and feeds the processing queues.
  # ---------------------------------------------------------------------------
  cbConsumer:
    enabled: true
    image:
      repository: queues-consumer
      tag: ""                   # TODO: pin the platform image tag
      pullPolicy: IfNotPresent
    replicas: 1
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    hpa:
      enabled: false
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 75
      targetMemoryUtilizationPercentage: 80
    pdb:
      enabled: false
      minAvailable: 1
    serviceMonitor:
      enabled: false
      port: metrics
      path: /metrics
      interval: 15s
    ports:
      - containerPort: 8001
        protocol: TCP
        name: cb-consumer
      - containerPort: 8000
        protocol: TCP
        name: metrics
    service:
      - port: 8001
        name: cb-consumer
      - port: 8000
        name: metrics
    livenessProbe:
      httpGet:
        path: /hchk
        port: cb-consumer
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 15
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /hchk
        port: cb-consumer
      initialDelaySeconds: 10
      periodSeconds: 30
      timeoutSeconds: 15
      successThreshold: 1
    resources: {}
    gatewayAPI:
      enabled: false
    config:
      AETHER_LINK_URL: http://aether-link:8000
      IOTA_URL: http://iot-agent-json:7896
      # Object storage: "s3" for an S3-compatible service, "local" for in-cluster
      # MinIO. Set the matching keys below. See docs/03-infrastructure.md.
      STORAGE_TYPE: <CHANGE_ME>           # s3 | local
      # -- STORAGE_TYPE: s3
      # AWS_S3_BUCKET: <CHANGE_ME>
      # AWS_S3_REGION: <CHANGE_ME>
      # AWS_S3_IMAGES_BUCKET: <CHANGE_ME>
      # AWS_S3_IMAGES_REGION: <CHANGE_ME>
      # -- STORAGE_TYPE: local (MinIO)
      # LOCAL_ENDPOINT: <CHANGE_ME>       # e.g. minio.minio.svc.cluster.local:9000
      # LOCAL_BUCKET: pid-gijon-storage
      # LOCAL_IMAGES_ENDPOINT: <CHANGE_ME>
      # LOCAL_IMAGES_BUCKET: pid-gijon-storage
      DB_DATABASE: <CHANGE_ME>            # main PostgreSQL database name
      DB_HOST: <CHANGE_ME>                # PostgreSQL host
      DB_PORT: "5432"
      DB_REALTIME_DATABASE: realtime
      DB_REALTIME_HOST: <CHANGE_ME>       # PostgreSQL host (may be the same)
      DB_REALTIME_PORT: "5432"
      TIMESERIES_TYPE: timescale
      TS_DB_DATABASE: <CHANGE_ME>         # TimescaleDB database name
      TS_DB_HOST: <CHANGE_ME>             # TimescaleDB host
      TS_DB_PORT: "5432"
      DEFAULT_NOTIFICATION_FORMAT: ngsild
      KEYCLOAK_CLIENT_ID: queues-consumer-client
      KEYCLOAK_URL: http://keycloak:8080
      RABBITMQ_HOST: <CHANGE_ME>          # RabbitMQ host
      RABBITMQ_PORT: <CHANGE_ME>          # 5672 (amqp) or 5671 (amqps)
      RABBITMQ_SECURITY: <CHANGE_ME>      # amqp | amqps
      RABBITMQ_VHOST: pid-gijon
      # Container-internal working dirs (do not change).
      QUEUE_CONSUMER_WORKERS: "1"
      UVICORN_WORKERS: "1"
      WORKER_CONCURRENCY: "4"
      LAUNCH_CELERY_SCHEDULER: "false"
      LAUNCH_UVICORN: "true"
      WORKER_TYPE: cb_processor
      # Queue task priorities / timeouts (tuning; safe defaults).
      QUEUE_TASK_CONFIG_DEFAULT_PRIORITY: "10"
      QUEUE_TASK_CONFIG_DEFAULT_TIMEOUT: "5"
      QUEUE_TASK_CONFIG_PLATFORM_SYNC_CB_NOTIFICATION_PRIORITY: "20"
      QUEUE_TASK_CONFIG_PLATFORM_SYNC_CB_NOTIFICATION_TIMEOUT: "15"
      QUEUE_TASK_CONFIG_PLATFORM_SYNC_REALTIME_PRIORITY: "15"
      QUEUE_TASK_CONFIG_PLATFORM_SYNC_REALTIME_TIMEOUT: "5"
      QUEUE_TASK_CONFIG_PLATFORM_SYNC_TIMESERIES_PRIORITY: "15"
      QUEUE_TASK_CONFIG_PLATFORM_SYNC_TIMESERIES_TIMEOUT: "5"
      # -- Optional integrations
      # GRID_WRF_URL: <CHANGE_ME>         # TODO: weather grid service
      # TILEMAPPER_URL: <CHANGE_ME>       # TODO: tile-mapper service
    secrets: {}
    #   DB_USERNAME / DB_PASSWORD                       # TODO: set
    #   TS_DB_USERNAME / TS_DB_PASSWORD                 # TODO: set
    #   DB_REALTIME_USERNAME / DB_REALTIME_PASSWORD     # TODO: set
    #   RABBITMQ_USER / RABBITMQ_PASSWORD               # TODO: set
    #   KEYCLOAK_USER / KEYCLOAK_PASSWORD               # TODO: set (consumer service account)
    #   MAIL_USERNAME / MAIL_PASSWORD                   # TODO: set
    #   STORAGE_TYPE s3:    AWS_S3_ACCESS_ID / AWS_S3_SECRET_KEY (+ *_IMAGES_*)
    #   STORAGE_TYPE local: LOCAL_ACCESS_ID / LOCAL_SECRET_KEY (+ *_IMAGES_*)

  # ---------------------------------------------------------------------------
  # generic-consumer — generic queue worker (crowd ETLs, data cache and the
  # data importation job).
  # ---------------------------------------------------------------------------
  genericConsumer:
    enabled: true
    image:
      repository: queues-consumer
      tag: ""                   # TODO: pin (same image as cb-consumer)
      pullPolicy: IfNotPresent
    replicas: 1
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    hpa:
      enabled: false
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilizationPercentage: 75
      targetMemoryUtilizationPercentage: 80
    pdb:
      enabled: false
      minAvailable: 1
    serviceMonitor:
      enabled: false
      port: metrics
      path: /metrics
      interval: 30s
    ports:
      - containerPort: 8001
        protocol: TCP
        name: generic
      - containerPort: 8000
        protocol: TCP
        name: metrics
    service:
      - port: 8001
        name: generic
      - port: 8000
        name: metrics
    livenessProbe:
      httpGet:
        path: /hchk
        port: generic
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 15
      failureThreshold: 3
    resources: {}
    gatewayAPI:
      enabled: false
    config:
      AETHER_LINK_URL: http://aether-link:8000
