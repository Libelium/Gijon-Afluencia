      BROADCAST_DRIVER: log
      CACHE_DRIVER: database
      DB_CONNECTION: pgsql
      DB_DATABASE: <CHANGE_ME>            # main PostgreSQL database name
      DB_DEVICE_MANAGER_DATABASE: device_manager
      DB_HOST: <CHANGE_ME>                # PostgreSQL host
      DB_PORT: "5432"
      DB_REALTIME_DATABASE: realtime
      DB_REALTIME_HOST: <CHANGE_ME>       # PostgreSQL host
      DB_REALTIME_PORT: "5432"
      FILESYSTEM_DISK: local
      # Object storage (mirror the consumers' STORAGE_TYPE choice).
      # AWS_S3_BUCKET: <CHANGE_ME>
      # AWS_S3_REGION: <CHANGE_ME>
      # AWS_S3_IMAGES_BUCKET: <CHANGE_ME>
      # AWS_S3_IMAGES_REGION: <CHANGE_ME>
      # -- For MinIO (local) also set:
      # AWS_ENDPOINT: <CHANGE_ME>         # e.g. http://minio.minio.svc.cluster.local:9000
