      FRONTEND_URL: <CHANGE_ME>           # public frontend URL
      KEYCLOAK_URL: http://keycloak:8080  # internal Keycloak service
      KEYCLOAK_REDIRECT_URI: <CHANGE_ME>  # public Keycloak URL
      KC_IMPERSONATION_REALM: pid-gijon
      KC_IMPERSONATION_URL: http://keycloak:8080
      KC_IMPERSONATION_CLIENT_ID: pid-gijon-client
      LOG_CHANNEL: stack
