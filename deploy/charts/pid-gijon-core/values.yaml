  # ---------------------------------------------------------------------------
  # carrot — receives context-broker notifications and routes them to RabbitMQ.
  # ---------------------------------------------------------------------------
  carrot:
    enabled: true
    image:
      repository: queues-consumer
      tag: ""                   # TODO: pin (same image as cb-consumer)
      pullPolicy: IfNotPresent
    replicas: 1
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    hpa:
      enabled: false
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilizationPercentage: 75
      targetMemoryUtilizationPercentage: 80
    pdb:
      enabled: false
      minAvailable: 1
    serviceMonitor:
      enabled: false
      port: metrics
      path: /metrics
      interval: 30s
    ports:
      - containerPort: 8001
        protocol: TCP
        name: carrot
      - containerPort: 8000
        protocol: TCP
        name: metrics
    service:
      - port: 8001
        name: carrot
      - port: 8000
        name: metrics
    livenessProbe:
      httpGet:
        path: /hchk
        port: carrot
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 15
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /hchk
        port: carrot
      initialDelaySeconds: 15
      periodSeconds: 30
      timeoutSeconds: 15
      successThreshold: 1
    resources: {}
    gatewayAPI:
      enabled: false
      # routes:
      #   - httpsOnly: true
      #     route:
      #       gateway: internal-gateway
      #       hostnames: ["carrot.example.com"]
      #       backendPort: 8001
    config:
      AETHER_LINK_URL: http://aether-link:8000
      DEFAULT_NOTIFICATION_FORMAT: ngsild
      QUEUE_CONSUMER_WORKERS: "0"
      RABBITMQ_HOST: <CHANGE_ME>
      RABBITMQ_PORT: <CHANGE_ME>
      RABBITMQ_SECURITY: <CHANGE_ME>      # amqp | amqps
      RABBITMQ_VHOST: pid-gijon
      TIMESERIES_TYPE: timescale
      UVICORN_WORKERS: "3"
      WORKER_CONCURRENCY: "10"
      LAUNCH_CELERY_SCHEDULER: "false"
      LAUNCH_UVICORN: "true"
      WORKER_TYPE: universal
      QUEUE_TASK_CONFIG_DEFAULT_PRIORITY: "10"
      QUEUE_TASK_CONFIG_DEFAULT_TIMEOUT: "5"
      QUEUE_TASK_CONFIG_PLATFORM_SYNC_CB_NOTIFICATION_PRIORITY: "20"
      QUEUE_TASK_CONFIG_PLATFORM_SYNC_CB_NOTIFICATION_TIMEOUT: "20"
      QUEUE_TASK_CONFIG_PLATFORM_SYNC_REALTIME_PRIORITY: "15"
      QUEUE_TASK_CONFIG_PLATFORM_SYNC_REALTIME_TIMEOUT: "5"
      QUEUE_TASK_CONFIG_PLATFORM_SYNC_TIMESERIES_PRIORITY: "15"
      QUEUE_TASK_CONFIG_PLATFORM_SYNC_TIMESERIES_TIMEOUT: "5"
    secrets: {}
    #   RABBITMQ_USER / RABBITMQ_PASSWORD   # TODO: set

  # ---------------------------------------------------------------------------
  # web-back — main backend API (Laravel). Runs DB migrations via an init container.
  # ---------------------------------------------------------------------------
  webBack:
    enabled: true
    image:
      repository: web-back
      tag: ""                   # TODO: pin the platform image tag
      pullPolicy: IfNotPresent
    replicas: 1
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    hpa:
      enabled: false
      minReplicas: 1
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
    pdb:
      enabled: false
      minAvailable: 1
    ports:
      - containerPort: 80
        protocol: TCP
        name: web-back
    service:
      - port: 80
        name: web-back
    # Runs database migrations before the main container starts. It inherits the
    # component's config + secrets (envFrom). Keep its tag aligned with the main image.
    initContainers:
      - name: web-back-migrations
        image: web-back
        tag: ""                 # TODO: pin (same tag as web-back)
        command: ["sh", "-c", "/var/www/html/migration.sh||true"]
    livenessProbe:
      httpGet:
        path: /api/hchk
        port: web-back
      initialDelaySeconds: 10
      periodSeconds: 30
      timeoutSeconds: 15
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /api/hchk
        port: web-back
      initialDelaySeconds: 10
      periodSeconds: 30
      timeoutSeconds: 15
      successThreshold: 1
    resources: {}
    gatewayAPI:
