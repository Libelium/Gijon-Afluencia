{{- /*
Keycloak client credentials for the gateway.

Default (`values`): the openid-connect plugin reads keycloak.clientSecret inline
from the (git-ignored) environment values file; this Secret stores the same
credentials for reference and for tooling that wires APISIX secret references.

`useExternalSecret: true`: an ExternalSecret (External Secrets Operator) syncs
the credentials from your secret manager into keycloak.secretName instead — no
secret value is rendered from chart values.
*/ -}}
{{- if .Values.keycloak.useExternalSecret }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.keycloak.secretName }}
  labels:
    {{- include "apisix.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.keycloak.secretRefreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.keycloak.secretStoreName }}
    kind: {{ .Values.keycloak.secretStoreKind | default "SecretStore" }}
  target:
    name: {{ .Values.keycloak.secretName }}
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: keycloak-client-id
      remoteRef:
        key: {{ .Values.keycloak.externalSecretName }}
        property: client_id
    - secretKey: keycloak-client-secret
      remoteRef:
        key: {{ .Values.keycloak.externalSecretName }}
        property: client_secret
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.keycloak.secretName }}
  labels:
    {{- include "apisix.labels" . | nindent 4 }}
type: Opaque
stringData:
  keycloak-client-id: {{ .Values.keycloak.clientId | quote }}
  keycloak-client-secret: {{ .Values.keycloak.clientSecret | quote }}
{{- end }}
