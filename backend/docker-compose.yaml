services:
  backend:
    container_name: pid-backend
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - WITH_XDEBUG=true
        # El contenedor corre como uid 1001 y escribe en el montaje de ./src: sin alinearlo
        # con el uid del anfitrion, Laravel no puede escribir storage/ ni bootstrap/cache.
        - UID=${HOST_UID:-1001}
        - GID=${HOST_GID:-1001}
    ports:
      - '8000:80'
    volumes:
      - './src:/var/www/html'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - pid_network

networks:
  pid_network:
    driver: bridge
