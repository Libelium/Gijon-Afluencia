# Suppress the Apache version banner and disable TRACE/TRACK (the Qualys/PCI
# checks fingerprint on the Server header; ServerTokens Prod -> "Server: Apache").
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    LogFormat "%h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\" Payload=%{X-Payload}o UserId=%{X-User-Id}o" combined_with_user

    # Security headers (mod_headers). "always" so they are also set on error
    # responses (e.g. the 404 the scanner probes). X-Powered-By is also disabled
    # via expose_php=Off; unsetting here is defense in depth.
    Header always set X-Content-Type-Options "nosniff"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always unset X-Powered-By

    <Directory /var/www/html>
        AllowOverride All
        Options FollowSymLinks
        Require all granted

        # CORS is handled by Laravel (HandleCors middleware + config/cors.php),
        # which reflects only allowlisted origins. CORS headers were removed from
        # Apache: setting Access-Control-Allow-Origin "*" together with
        # Access-Control-Allow-Credentials "true" is an insecure combination.
    </Directory>

    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined_with_user
</VirtualHost>
