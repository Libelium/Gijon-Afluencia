# Runs the built image (no source bind-mount), reading configuration from src/.env.
services:
  backend:
    container_name: pid-backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8000:80'
    env_file:
      - src/.env
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - pid_network

networks:
  pid_network:
    driver: bridge
